<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Restaurante Siglo XXI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Concepto: sistema web del restaurante con barra superior, menú por rol y tarjetas grandes. Atkinson Hyperlegible por su legibilidad. */
:root{
  --bg:#F1F5F3; --surface:#FFFFFF; --surface2:#E8EFEB; --fg:#14231C; --muted:#44584E; --line:#BCCBC2;
  --brand:#1F6B4F; --on-brand:#FFFFFF; --accent:#9A5B00; --accentbg:#FFF1D6;
  --ok:#17653F; --bad:#A8231B; --okbg:#DDF1E5; --badbg:#FBE3E0; --warnbg:#FFF1D6;
  --fs:16px; --font:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
:root[data-contrast="alto"]{--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#EDEDED;--fg:#000000;--muted:#1A1A1A;--line:#000000;--brand:#0B3D2A;--accent:#6B3A00;--ok:#0B4A2B;--bad:#8A0000}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:1.5rem}h3{font-size:1.15rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-block:14px 40px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand);color:var(--on-brand);padding:10px 14px;border-radius:14px}
:root[data-contrast="alto"] .top{border:2px solid #000}
.logo{width:40px;height:40px;border-radius:50%;border:3px solid var(--on-brand);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.brand{flex:1;min-width:160px;font-weight:700;font-size:1.15rem}.brand small{display:block;font-weight:400;font-size:.8rem;opacity:.95}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tb{background:rgba(255,255,255,.18);color:var(--on-brand);border:1px solid rgba(255,255,255,.5);border-radius:10px;padding:6px 10px;min-height:40px;cursor:pointer;font-weight:700}
.tb:hover{background:rgba(255,255,255,.3)}
.who{font-size:.85rem;text-align:right}.who b{display:block}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 16px;min-height:46px;cursor:pointer;font-weight:700}
.tab[aria-current="page"]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.main{display:flex;flex-direction:column;gap:16px}
.hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.hd p{color:var(--muted)}
.card{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.btn{background:var(--brand);color:var(--on-brand);border:2px solid var(--brand);border-radius:12px;padding:10px 18px;min-height:46px;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.12)}
.btn.sec{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.danger{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 12px;min-height:38px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;min-width:170px;flex:1}
label,.lbl{font-weight:700;font-size:.9rem}
input[type=text],input[type=password],input[type=email],input[type=number],select{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:9px 11px;min-height:46px;width:100%}
.inv{border-color:var(--bad)!important}
.err{color:var(--bad);font-size:.88rem;font-weight:700}
.hint{color:var(--muted);font-size:.9rem}
.chk{display:flex;gap:8px;align-items:center;font-weight:400;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}tr:last-child td{border-bottom:0}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:700;border:1px solid currentColor}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--accent)}.pill.off{background:var(--surface2);color:var(--muted)}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.dish{display:flex;flex-direction:column;gap:6px;border:2px solid var(--line);border-radius:14px;padding:14px;background:var(--surface)}
.price{font-weight:700;font-size:1.15rem}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:44px;height:44px;border-radius:10px;border:2px solid var(--brand);background:var(--surface);font-size:1.4rem;font-weight:700;cursor:pointer;color:var(--brand)}
.qty span{min-width:26px;text-align:center;font-weight:700;font-size:1.1rem}
.login{max-width:440px;margin:28px auto;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:24px}
.demo{display:flex;gap:6px;flex-wrap:wrap}
.demo button{background:var(--surface2);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;min-height:36px}
.ord{border-left:8px solid var(--brand)}.ord.late{border-left-color:var(--bad)}
.num{background:var(--brand);color:var(--on-brand);border-radius:10px;padding:2px 10px;font-weight:700}
.big{font-size:2rem;font-weight:700}
.rules{list-style:none;margin:2px 0 0;padding:0;font-size:.88rem;color:var(--muted)}
.rules li::before{content:"○ "}.rules li.ok{color:var(--ok)}.rules li.ok::before{content:"● "}
details{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
summary{font-weight:700;cursor:pointer;min-height:32px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:9;font-weight:700;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:8}
.modal>div{background:var(--surface);border-radius:16px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px;border:2px solid var(--line)}
.ex{font-size:.82rem;color:var(--muted);font-style:italic}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  S.user=u;S.fails[un]=0;S.loginErr="";S.idle=false;S.view=NAV[u.role][0][0];S.ue=null;log("Ingreso al sistema");resetIdle();paint();window.scrollTo(0,0);return}
 if(a==="logout"){log("Cierre de sesión");S.user=null;S.view=null;S.ue=null;S.idle=false;paint();return}
 if(a==="nav"){S.view=v;S.ue=null;paint();return}
 if(a==="lang"){S.lang=S.lang==="es"?"en":"es";paint();return}
 if(a==="cat"){S.cat=v;paint();return}
 if(a==="addd"||a==="inc"){CART[v]=(CART[v]||0)+1;paint();return}
 if(a==="dec"){CART[v]=(CART[v]||1)-1;if(CART[v]<=0)delete CART[v];paint();return}
 if(a==="call"){toast(T[S.lang].called);return}
 if(a==="sendord"){var it=Object.keys(CART).map(function(k){return[k,CART[k]]});ORD.push({id:NEXT++,mesa:S.user.mesa,t:Date.now(),st:"nuevo",it:it});CART={};S.view="mipedido";toast(T[S.lang].sent);return}
 if(a==="kprep"||a==="klisto"||a==="kent"){var o=ORD.filter(function(x){return x.id===+v})[0];o.st=a==="kprep"?"prep":a==="klisto"?"listo":"entregado";paint();return}
 if(a==="ingreso"){var q=Number($("i-q").value);if(!(q>0)){$("ierr").textContent="Ingrese una cantidad mayor que cero.";return}ins($("i-ins").value).s+=q;toast("Producto ingresado al stock.");return}
 if(a==="genpo"){var N=need();PO.unshift({id:"P-"+(PO.length+1),f:new Date().toLocaleDateString("es-CL"),u:S.user.user,l:N.map(function(x){return{q:x.q,un:x.i.u,n:x.i.n,pr:x.i.pr}})});log("Generó pedido a proveedores");toast("Pedido a proveedores generado.");return}
 if(a==="mov"){var c=$("m-c").value.trim(),m=Number($("m-m").value);if(!c||!(m>0)){$("merr").textContent="Ingrese el concepto y un monto mayor que cero.";return}MOV.push({d:TODAY,k:$("m-k").value,c:c,m:m});toast("Movimiento registrado.");return}
 if(a==="addp"){var n=$("p-n").value.trim(),p=Number($("p-p").value);if(n.length<3||!(p>0)){$("perr").textContent="Ingrese el nombre y un precio mayor que cero.";return}DISH.push({id:"x"+DISH.length,cat:$("p-c").value,es:n,en:n,de:"Producto nuevo.",dn:"New product.",p:p,t:5});log("Agregó producto "+n);toast("Producto agregado.");return}
 if(a==="addt"){var nn=Number($("t-n").value),cc=Number($("t-c").value);if(!(nn>0)||!(cc>0)){$("terr").textContent="Ingrese el número y la capacidad.";return}if(MESAS.some(function(m){return m.n===nn})){$("terr").textContent="Esa mesa ya existe.";return}MESAS.push({n:nn,c:cc});log("Agregó mesa "+nn);toast("Mesa agregada.");return}
 if(a==="newu"){S.ue={name:"",user:"",email:"",role:"",mesa:null,pw:"",active:true,err:{}};paint();return}
 if(a==="editu"){var x=USERS.filter(function(z){return z.id===+v})[0];S.ue=Object.assign({pw:"",err:{}},x);paint();return}
 if(a==="cancelu"){S.ue=null;paint();return}
 if(a==="resetpw"){log("Restableció contraseña de "+S.ue.user);toast("Se enviaría una contraseña temporal al correo (simulado).");return}
 if(a==="saveu"){
  if(!validU()){paint();var fe=document.querySelector(".inv");if(fe)fe.focus();return}
  var u2=S.ue;
  if(u2.id){var o2=USERS.filter(function(z){return z.id===u2.id})[0];["name","email","role","active","mesa"].forEach(function(k){o2[k]=u2[k]});log("Modificó al usuario "+o2.user);toast("Cambios guardados.")}
  else{USERS.push({id:USERS.length+10,user:u2.user,name:u2.name.trim(),email:u2.email.trim(),role:u2.role,active:u2.active,locked:false,mesa:u2.role==="Cliente"?+u2.mesa:null});PASS[u2.user]=u2.pw;log("Creó al usuario "+u2.user);toast("Usuario creado correctamente.")}
  S.ue=null;paint();return}
 if(a==="unlock"){var y=USERS.filter(function(z){return z.id===+v})[0];y.locked=false;S.fails[y.user]=0;log("Desbloqueó a "+y.user);toast("Usuario desbloqueado.");return}
 if(a==="delu"){var d=USERS.filter(function(z){return z.id===+v})[0];if(d.id===S.user.id){toast("No puede eliminar su propia cuenta.");return}S.modal=d;paint();return}
 if(a==="cancelmodal"){S.modal=null;paint();return}
 if(a==="confdel"){var dd=S.modal;USERS.splice(USERS.indexOf(dd),1);delete PASS[dd.user];log("Eliminó al usuario "+dd.user);S.modal=null;toast("Usuario eliminado.");return}
});
paint();
})();
</script>
